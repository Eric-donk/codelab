<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>CodeLab · SQL & Python 学习空间</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e5e7eb;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,textarea,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#0b1020ee;backdrop-filter:blur(12px);border-bottom:1px solid #29334a;z-index:2}.wrap{max-width:1000px;margin:auto;padding:18px}header .wrap{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}h2{font-size:21px}p{line-height:1.7;color:#b8c3d7}.muted{color:#9baac2;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#151e32;border:1px solid #2b3953;border-radius:18px;padding:20px;margin:14px 0}.stat{font-size:30px;font-weight:800;margin:8px 0}button,.button{border:1px solid #455775;border-radius:12px;background:#263653;color:#f1f5f9;padding:11px 15px;text-decoration:none;display:inline-block}button.primary{background:#5b6ff3;border-color:#5b6ff3;color:white;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button.active{background:#5b6ff3;border-color:#5b6ff3}.pill{border-radius:999px;padding:5px 10px;background:#23314c;color:#bcd0ff;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.lesson{line-height:1.8;white-space:pre-line}.code{white-space:pre-wrap;background:#080e1d;border-radius:12px;padding:15px;overflow:auto;color:#b9e6cb;font-size:14px}textarea{width:100%;min-height:155px;resize:vertical;background:#0c1425;border:1px solid #44516c;border-radius:12px;color:white;padding:14px;line-height:1.6;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #33435c;padding:9px 5px;text-align:left}.scroll{overflow-x:auto}details{border:1px solid #33435c;border-radius:12px;padding:12px;margin:10px 0}summary{cursor:pointer;font-weight:650}footer{padding:35px 0;color:#8e9bb1;font-size:13px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#34456b;padding:12px 18px;border-radius:12px;display:none;z-index:3}@media(max-width:600px){.wrap{padding:14px}.card{padding:16px}.grid{gap:9px}.stat{font-size:25px}h1{font-size:19px}button{padding:10px 12px}}</style></head><body><header><div class="wrap"><h1>📚 CodeLab <span class="muted">SQL + Python</span></h1><span class="pill">学习空间 v1</span></div></header><main class="wrap"><div class="row"><div><h2>欢迎回来 👋</h2><p>课程、题目和答案待在同一个页面，不用再翻聊天记录。</p></div><button onclick="show('settings')">⚙️ 数据管理</button></div><section class="grid"><div class="card"><div class="muted">🗄️ SQL 已通关</div><div class="stat" id="sqlStat">6 天</div><div class="muted">下一关 Day 7 · 综合 Boss</div></div><div class="card"><div class="muted">🐍 Python 已通关</div><div class="stat" id="pyStat">2 天</div><div class="muted">下一关 Day 3 · 数据类型</div></div></section><nav class="tabs"><button data-tab="sql" onclick="show('sql')">🗄️ SQL</button><button data-tab="python" onclick="show('python')">🐍 Python</button><button data-tab="mistakes" onclick="show('mistakes')">📕 错题本</button><button data-tab="history" onclick="show('history')">📈 学习记录</button></nav><div id="view"></div><footer>本网站的数据默认只保存在当前浏览器。跨设备请通过“数据管理”导出/导入备份。不要在公共设备保存私人学习内容。</footer></main><div id="toast"></div><script>
const KEY='codelab-v1';const defaults={sqlDone:6,pythonDone:2,answers:{},mistakes:[],events:[]};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)};const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(state));updateStats()}function updateStats(){$('sqlStat').textContent=state.sqlDone+' 天';$('pyStat').textContent=state.pythonDone+' 天'}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2000)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let tab='sql';function show(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='sql')sql();else if(t==='python')python();else if(t==='mistakes')mistakes();else if(t==='history')history();else settings()}
const rows=[['001','针灸研究A','80','PubMed'],['002','音乐研究B','120','Scopus'],['003','针灸研究A','80','Scopus'],['004','早期活动C','100','Embase'],['005','音乐研究B','120','PubMed'],['006','针灸研究D','80','Embase']];const sqlQs=[['主键与重复记录','编号001和003研究名称、样本量相同，编号不同。它们违反主键规则吗？能仅凭表格断定是同一篇文献并删除吗？分别说明理由。'],['SELECT 的真实作用','执行 SELECT 研究名称, 样本量 FROM 文献; 后，结果有几行几列？写出各行内容。两个“音乐研究B”会自动合并吗？为什么？'],['识别错误操作','编号004的样本量应为110。有人建议删除编号004，再新增编号007、样本量110的记录。你会怎样处理？这样做可能有什么问题？'],['设计与判断','你会用“研究名称”还是“编号”作为主键？如果只想查看来自 Scopus 的文献，仅用已学 SELECT 和 FROM 能做到吗？为什么？']];const pyQs=[['变量与整数','解释下面代码逐行发生什么，写出最终 total、count、label 的值，并指出哪个变量是整数、哪个是字符串。','count = 3\ntotal = 80\nlabel = "文献"\ntotal = total + count\ncount = 5'],['字符串与数字','以下两行分别有什么含义？如果想把 3 和 5 当作数字相加，应该选哪种写法？','a = 3\nb = "3"'],['数据分析判断','数据库导出的一列“样本量”里有 80、120 和 "未知"。为什么不能直接把三项当作数字相加？请用今天学到的数据类型概念解释。','']];function questionList(track,qs){return qs.map((q,i)=>{const k=track+'-'+i;return `<div class="card"><div class="row"><strong>${i+1}. ${esc(q[0])}</strong><span class="pill">自动保存草稿</span></div><p>${esc(q[1])}</p>${q[2]?`<pre class="code">${esc(q[2])}</pre>`:''}<textarea aria-label="第${i+1}题答案" placeholder="写下答案和推理过程……" oninput="answer('${k}',this.value)">${esc(state.answers[k]||'')}</textarea><details><summary>💡 自查提示（答完再看）</summary><p>${track==='sql'?'先区分主键、重复文献、选列和选行；仅凭名称相同不能确认同一篇文献。':'注意赋值顺序、引号和数字的区别；未知值不是数字。'}</p></details><button onclick="toggleMistake('${k}','${track==='sql'?'SQL':'Python'} · ${esc(q[0])}')">${state.mistakes.some(x=>x.key===k)?'✓ 已加入错题本':'＋ 加入错题本'}</button></div>`}).join('')};function answer(k,v){state.answers[k]=v;save()}function toggleMistake(key,title){const idx=state.mistakes.findIndex(x=>x.key===key);if(idx>=0)state.mistakes.splice(idx,1);else state.mistakes.push({key,title,date:new Date().toLocaleDateString('zh-CN')});save();show(tab)}function complete(track){const qs=track==='sql'?sqlQs:pyQs;if(!qs.every((_,i)=>(state.answers[track+'-'+i]||'').trim())){toast('请先填写全部题目的答案');return}const day=track==='sql'?7:3;const prop=track==='sql'?'sqlDone':'pythonDone';if(state[prop]>=day){toast('这一关已标记完成');return}state[prop]=day;state.events.push({track,day,date:new Date().toLocaleString('zh-CN')});save();toast('已记录通关！');show(track)}function sql(){$('view').innerHTML=`<div class="card"><div class="row"><h2>SQL Day 7 · 综合 Boss 👹</h2><span class="pill">${state.sqlDone>=7?'已完成':'待挑战'}</span></div><p>复习主键、行列、数据类型、查加改删、SELECT 和 FROM。今天不涉及 WHERE。</p><details open><summary>📋 题目数据表（随时展开查看）</summary><div class="scroll"><table><thead><tr><th>编号</th><th>研究名称</th><th>样本量</th><th>数据库</th></tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')}</tbody></table></div></details><pre class="code">SELECT 研究名称, 样本量\nFROM 文献;</pre></div>${questionList('sql',sqlQs)}<div class="card"><p>完成四题后可以先在 ChatGPT 中提交答案，请我批改；确认掌握后再标记通关。</p><button class="primary" onclick="copyAnswers('sql')">📋 复制答案给 ChatGPT 批改</button> <button onclick="complete('sql')">✓ 我已完成并通过</button></div>`}function python(){$('view').innerHTML=`<div class="card"><div class="row"><h2>Python Day 3 · 基础数据类型 🐍</h2><span class="pill">${state.pythonDone>=3?'已完成':'待挑战'}</span></div><div class="lesson"><strong>1. 变量像贴标签的盒子</strong>：<code>count = 3</code> 表示给 count 赋值为 3。\n<strong>2. 整数 int</strong>：例如 <code>3</code>、<code>80</code>，可以用于数字计算。\n<strong>3. 字符串 str</strong>：例如 <code>"3"</code>、<code>"文献"</code>，引号中的内容是文本，即使看起来像数字也不同于整数。\n<strong>4. 顺序执行</strong>：代码从上到下运行，重新赋值不会自动重算其他变量。\n<strong>5. 数据分析提醒</strong>：数字列里混入“未知”等文字时，要先检查数据，不能直接假装它是数字。</div><pre class="code">count = 3       # 整数：数量\nlabel = "文献"  # 字符串：文字</pre><p>符号解释：<code>=</code> 表示赋值；<code>" "</code> 表示文本边界；<code>#</code> 后面是给人看的注释，不参与计算。</p></div>${questionList('python',pyQs)}<div class="card"><p>先独立作答，再复制答案给 ChatGPT 逐题批改。网站第一版不会假装自动理解你的开放题。</p><button class="primary" onclick="copyAnswers('python')">📋 复制答案给 ChatGPT 批改</button> <button onclick="complete('python')">✓ 我已完成并通过</button></div>`}function copyAnswers(track){const qs=track==='sql'?sqlQs:pyQs;const s=(track==='sql'?'SQL Day 7':'Python Day 3')+' 请逐题批改我的答案，指出错误和思考漏洞：\n\n'+qs.map((q,i)=>(i+1)+'. '+q[1]+'\n我的回答：'+(state.answers[track+'-'+i]||'（未作答）')).join('\n\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>toast('已复制，粘贴到 ChatGPT 即可')).catch(()=>fallback(s));else fallback(s)}function fallback(s){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('已复制答案')}function mistakes(){$('view').innerHTML=`<div class="card"><h2>📕 错题本</h2><p>遇到不确定的题，点击“加入错题本”。这里会保存对应题目和你的草稿。</p>${state.mistakes.length?state.mistakes.map(m=>`<details><summary>${esc(m.title)} · ${esc(m.date)}</summary><p>我的草稿：</p><pre class="code">${esc(state.answers[m.key]||'暂无')}</pre><button onclick="toggleMistake('${m.key}','')">移出错题本</button></details>`).join(''):'<p>目前没有标记的错题。</p>'}</div>`}function history(){$('view').innerHTML=`<div class="card"><h2>📈 学习记录</h2><p>SQL：已完成 Day ${state.sqlDone}；Python：已完成 Day ${state.pythonDone}。</p><p class="muted">“已完成天数”表示课程关卡数，不等于连续自然日打卡天数。</p>${state.events.length?state.events.slice().reverse().map(e=>`<p>${esc(e.date)} · ${esc(e.track.toUpperCase())} Day ${e.day} 通关</p>`).join(''):'<p>首次使用网站，之后通关的记录会显示在这里。</p>'}</div>`}function settings(){$('view').innerHTML=`<div class="card"><h2>⚙️ 数据管理</h2><p>所有答题草稿、错题和通关记录保存在当前浏览器 localStorage 中。手机和电脑目前不会自动同步。</p><div class="row"><button class="primary" onclick="exportData()">⬇ 导出学习进度</button><label class="button">⬆ 导入进度文件<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label></div><p class="muted">导入会替换本设备现有学习数据。建议先导出备份。</p><details><summary>危险操作：重置所有进度</summary><button onclick="resetData()">清空本设备学习数据</button></details><p>上线建议：将此静态网页部署到 GitHub Pages 或 Netlify，获得 HTTPS 网址。部署和跨设备云同步尚未执行。</p></div>`}function exportData(){const b=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='codelab-progress.json';a.click();URL.revokeObjectURL(u);toast('备份文件已生成')}function importData(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Number.isInteger(d.sqlDone)||!Number.isInteger(d.pythonDone)||typeof d.answers!=='object'||Array.isArray(d.answers)||!Array.isArray(d.mistakes)||!Array.isArray(d.events))throw Error('invalid');if(!confirm('导入将替换当前设备的学习记录，继续吗？'))return;state={sqlDone:d.sqlDone,pythonDone:d.pythonDone,answers:d.answers,mistakes:d.mistakes,events:d.events};save();show('settings');toast('导入成功')}catch{toast('文件格式不正确')}};r.readAsText(f)}function resetData(){if(confirm('确定清空当前设备所有进度和答案？此操作不可撤销。')){state=structuredClone(defaults);save();show('settings');toast('已重置')}}updateStats();show('sql');</script></body></html>
